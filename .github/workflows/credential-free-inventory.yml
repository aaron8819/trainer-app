name: Trainer pull request checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: credential-free-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tooling-portability:
    name: Trainer tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Match deployed npm runtime
        run: npm install --global npm@11.19.0
      - name: Validate command registry
        shell: pwsh
        run: ./scripts/codex/Test-TrainerCommandRegistry.ps1
      - name: Test tooling, policy and safety contracts
        shell: pwsh
        run: ./scripts/codex/tests/Run-Tests.ps1

  credential-free-shard:
    name: credential-free-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - "1/4"
          - "2/4"
          - "3/4"
          - "4/4"
    env:
      CI: true
      TZ: America/Chicago
    defaults:
      run:
        working-directory: trainer-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: trainer-app/package-lock.json

      - name: Match deployed npm runtime
        run: npm install --global npm@11.19.0

      - name: Resolve exact tested identity
        id: tested_identity
        shell: bash
        run: |
          echo "commit_sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Resolve shard identity
        id: shard_identity
        shell: bash
        run: |
          shard='${{ matrix.shard }}'
          echo "index=${shard%/*}" >> "$GITHUB_OUTPUT"
          echo "count=${shard#*/}" >> "$GITHUB_OUTPUT"

      - name: Install exact dependencies
        run: npm ci

      - name: Run credential-free shard
        id: credential_free_shard
        run: npm run test:inventory:credential-free:shard -- --shard "${{ matrix.shard }}"

      - name: Upload credential-free shard summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: credential-free-shard-${{ steps.shard_identity.outputs.index }}-of-${{ steps.shard_identity.outputs.count }}-tree-${{ steps.tested_identity.outputs.tree_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/components/credential-free-shard-${{ steps.shard_identity.outputs.index }}-of-${{ steps.shard_identity.outputs.count }}-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload credential-free shard failure bundle
        if: ${{ always() && steps.credential_free_shard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: credential-free-shard-${{ steps.shard_identity.outputs.index }}-of-${{ steps.shard_identity.outputs.count }}-failure-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/
          if-no-files-found: error
          retention-days: 7

  import-safety:
    name: import-safety
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      TZ: America/Chicago
    defaults:
      run:
        working-directory: trainer-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: trainer-app/package-lock.json

      - name: Match deployed npm runtime
        run: npm install --global npm@11.19.0

      - name: Resolve exact tested identity
        id: tested_identity
        shell: bash
        run: |
          echo "commit_sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Install exact dependencies
        run: npm ci

      - name: Run import safety
        id: import_safety
        run: npm run test:inventory:import-safety

      - name: Upload import-safety summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: import-safety-tree-${{ steps.tested_identity.outputs.tree_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/components/import-safety-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload import-safety failure bundle
        if: ${{ always() && steps.import_safety.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: import-safety-failure-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/
          if-no-files-found: error
          retention-days: 7

  credential-free-inventory:
    name: credential-free-inventory
    needs:
      - credential-free-shard
      - import-safety
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      TZ: America/Chicago
    defaults:
      run:
        working-directory: trainer-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: trainer-app/package-lock.json

      - name: Match deployed npm runtime
        run: npm install --global npm@11.19.0

      - name: Resolve exact tested identity
        id: tested_identity
        shell: bash
        run: |
          echo "commit_sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Install exact dependencies
        run: npm ci

      - name: Download credential-free shard summaries
        if: ${{ always() }}
        uses: actions/download-artifact@v5
        with:
          pattern: credential-free-shard-*-tree-${{ steps.tested_identity.outputs.tree_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/downloaded-components

      - name: Download import-safety summary
        if: ${{ always() }}
        uses: actions/download-artifact@v5
        with:
          pattern: import-safety-tree-${{ steps.tested_identity.outputs.tree_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/downloaded-components

      - name: Validate and aggregate credential-free inventory
        if: ${{ always() }}
        id: aggregate
        run: npm run test:inventory:aggregate -- --base-ref origin/master --credential-shards-result "${{ needs.credential-free-shard.result }}" --import-safety-result "${{ needs.import-safety.result }}"

      - name: Upload exact-tree verification evidence
        if: ${{ steps.aggregate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: credential-free-inventory-evidence-tree-${{ steps.tested_identity.outputs.tree_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/evidence/credential-free-inventory-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload aggregate failure diagnostics
        if: ${{ always() && steps.aggregate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: credential-free-inventory-aggregate-failure-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/aggregate/
          if-no-files-found: error
          retention-days: 7

  verification-coverage-report:
    name: Advisory affected verification coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Report affected verification coverage (advisory)
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force trainer-app/artifacts/verification-selection | Out-Null
          ./scripts/codex/Invoke-TrainerVerification.ps1 -BaseRef origin/master -Json |
            Set-Content trainer-app/artifacts/verification-selection/plan.json
          exit $LASTEXITCODE

      - name: Retain advisory verification report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-selection-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: trainer-app/artifacts/verification-selection/plan.json
          if-no-files-found: warn
          retention-days: 7

  trainer2-production-artifact:
    name: Trainer2 production build and admission
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      TRAINER2_ISOLATED_LINUX_JOB: '1'
    defaults:
      run:
        working-directory: trainer-app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: trainer-app/package-lock.json

      - name: Match deployed npm runtime
        run: npm install --global npm@11.19.0
      - name: Record exact source
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          git merge-base --is-ancestor "$CANDIDATE_BASE" HEAD
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/linux-qualification
          git rev-parse HEAD HEAD^{tree} > artifacts/linux-qualification/source.txt
          printf '%s\n' "$CANDIDATE_BASE" > artifacts/linux-qualification/base.txt
      - run: npm ci
      - name: Reject isolated known-invalid RGB favicon
        run: |
          original="$(mktemp)"
          cp src/app/favicon.ico "$original"
          cleanup() { cp "$original" src/app/favicon.ico && rm "$original"; }
          trap cleanup EXIT
          python3 - <<'PYTHON'
          import struct, zlib
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 32, 32, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress((b'\0' + b'\x12\x34\x56' * 32) * 32)) + chunk(b'IEND', b'')
          ico = struct.pack('<HHH', 0, 1, 1) + struct.pack('<BBBBHHII', 32, 32, 0, 0, 1, 32, len(png), 22) + png
          open('src/app/favicon.ico', 'wb').write(ico)
          PYTHON
          set +e
          timeout --signal=TERM --kill-after=10s 3m env -i PATH="$PATH" HOME="$HOME" \
            NEXT_TELEMETRY_DISABLED=1 TRAINER_BUILD_MODE=preview VERCEL_ENV=preview \
            npm run build > artifacts/linux-qualification/invalid-rgb-build.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          test "$result" -ne 137
          grep -E 'Rgb8|Unsupported color type|unsupported color type|The PNG is not in RGBA format' artifacts/linux-qualification/invalid-rgb-build.log
          cleanup
          trap - EXIT
          test -z "$(git status --porcelain)"
          echo 0 > artifacts/linux-qualification/invalid-rgb.exit
      - name: Build synthetic V2 production artifact
        run: |
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          test "$source_sha" = "$(sed -n '1p' artifacts/linux-qualification/source.txt)"
          test "$source_tree" = "$(sed -n '2p' artifacts/linux-qualification/source.txt)"
          test -z "$(git status --porcelain)"
          set +e
          timeout --signal=TERM --kill-after=10s 10m env -i PATH="$PATH" HOME="$HOME" \
            NODE_ENV=production NEXT_PHASE=phase-production-build NEXT_TELEMETRY_DISABLED=1 \
            VERCEL_ENV=production TRAINER_BUILD_MODE=v2-production \
            VERCEL_GIT_COMMIT_SHA="$source_sha" TRAINER_BUILD_GIT_SHA="$source_sha" \
            TRAINER_DEPLOYMENT_MODE=v2-production \
            TRAINER2_APP_ORIGIN=https://production-artifact.example.test \
            TRAINER2_OWNER_USER_ID=00000000-0000-0000-0000-000000000001 \
            TRAINER2_DB_CA_CERT_PEM=synthetic-blocked-ca \
            TRAINER2_IDENTITY_CONNECTION_STRING=postgresql://trainer2_identity_runtime:blocked@127.0.0.1:9/blocked \
            TRAINER2_READ_CONNECTION_STRING=postgresql://trainer2_draft_reader:blocked@127.0.0.1:9/blocked \
            TRAINER2_WRITE_CONNECTION_STRING=postgresql://trainer2_draft_runtime:blocked@127.0.0.1:9/blocked \
            npm run build > artifacts/linux-qualification/production-build.log 2>&1
          result=$?
          echo "$result" > artifacts/linux-qualification/production-build.exit
          cat artifacts/linux-qualification/production-build.log
          exit "$result"
      - name: Record successful build identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const read = path => readFileSync(path, 'utf8');
          writeFileSync('artifacts/linux-qualification/build.json', JSON.stringify({
            command: 'npm run build', packageBuild: JSON.parse(read('package.json')).scripts.build,
            node: process.version, npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
            next: JSON.parse(read('node_modules/next/package.json')).version,
            lockfileHash: createHash('sha256').update(read('package-lock.json')).digest('hex'),
            buildId: read('.next/BUILD_ID').trim(),
          }, null, 2));
          NODE
      - name: Started synthetic V2 production artifact
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 4m node --import tsx scripts/trainer2/verify-deployment-artifact.ts v2-production > artifacts/linux-qualification/production-artifact.log 2>&1
          result=$?
          echo "$result" > artifacts/linux-qualification/production-artifact.exit
          cat artifacts/linux-qualification/production-artifact.log
          exit "$result"
      - name: Retain source, exit status and cleanup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trainer2-acceptance-build-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trainer-app/artifacts/linux-qualification/
          retention-days: 7
          if-no-files-found: error

  trainer2-browser:
    name: Trainer2 browser (${{ matrix.journey }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      TRAINER2_ISOLATED_LINUX_JOB: '1'
    defaults:
      run:
        working-directory: trainer-app
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        journey: [equipment, navigation, logger]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: trainer-app/package-lock.json

      - name: Match deployed npm runtime
        run: npm install --global npm@11.19.0
      - name: Record exact source
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          git merge-base --is-ancestor "$CANDIDATE_BASE" HEAD
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/linux-qualification
          git rev-parse HEAD HEAD^{tree} > artifacts/linux-qualification/source.txt
          printf '%s\n' "$CANDIDATE_BASE" > artifacts/linux-qualification/base.txt
      - run: npm ci
      - name: Prepare disposable dependencies
        run: |
          docker pull postgres:17-alpine
          npx --no-install playwright install --with-deps chromium
      - name: Combined equipment journey (direct worker)
        if: ${{ !cancelled() && matrix.journey == 'equipment' }}
        env:
          TRAINER2_EQUIPMENT_WORKER: '1'
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 7m node --import tsx scripts/test-trainer2-equipment-recording.ts --confirm-disposable > artifacts/linux-qualification/equipment.log 2>&1
          result=$?
          echo "$result" > artifacts/linux-qualification/equipment.exit
          cat artifacts/linux-qualification/equipment.log
          exit "$result"
      - name: Empty and populated navigation journeys
        if: ${{ !cancelled() && matrix.journey == 'navigation' }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 10m node --import tsx scripts/test-trainer2-navigation.ts --confirm-disposable > artifacts/linux-qualification/navigation.log 2>&1
          result=$?
          echo "$result" > artifacts/linux-qualification/navigation.exit
          cat artifacts/linux-qualification/navigation.log
          exit "$result"
      - name: Logger swap resume finish journey
        if: ${{ !cancelled() && matrix.journey == 'logger' }}
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 10m node --import tsx scripts/test-trainer2-logger-design.ts --confirm-disposable > artifacts/linux-qualification/logger.log 2>&1
          result=$?
          echo "$result" > artifacts/linux-qualification/logger.exit
          cat artifacts/linux-qualification/logger.log
          exit "$result"
      - name: Retain source, exit status and cleanup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trainer2-acceptance-${{ matrix.journey }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trainer-app/artifacts/
          retention-days: 7
          if-no-files-found: error

  trainer2-combined-acceptance:
    name: Trainer2 disposable combined acceptance
    needs: [trainer2-production-artifact, trainer2-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Match deployed npm runtime
        run: npm install --global npm@11.19.0
      - name: Download exact-run acceptance components
        uses: actions/download-artifact@v5
        with:
          pattern: trainer2-acceptance-*-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trainer-app/artifacts/parallel-acceptance
      - name: Require complete successful source-bound acceptance
        env:
          ACCEPTANCE_NEEDS: ${{ toJSON(needs) }}
          ACCEPTANCE_HEAD: ${{ github.event.pull_request.head.sha }}
          ACCEPTANCE_BASE: ${{ github.event.pull_request.base.sha }}
          ACCEPTANCE_RUN: ${{ github.run_id }}
          ACCEPTANCE_ATTEMPT: ${{ github.run_attempt }}
        run: node trainer-app/scripts/aggregate-trainer2-acceptance.mjs
      - name: Retain aggregate acceptance receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trainer2-combined-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: trainer-app/artifacts/parallel-acceptance/receipt.json
          retention-days: 7
          if-no-files-found: error

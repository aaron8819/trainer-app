name: Trainer pull request checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: credential-free-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  credential-free-inventory:
    name: credential-free-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      TZ: America/Chicago
    defaults:
      run:
        working-directory: trainer-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trainer-app/package-lock.json

      - name: Resolve exact tested identity
        id: tested_identity
        shell: bash
        run: |
          echo "commit_sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Install exact dependencies
        run: npm ci

      - name: Run credential-free inventory
        id: credential_free_inventory
        run: npm run test:inventory:credential-free -- --base-ref origin/master

      - name: Upload exact-tree verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: credential-free-inventory-evidence-tree-${{ steps.tested_identity.outputs.tree_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/evidence/credential-free-inventory-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload credential-free failure bundle
        if: ${{ always() && steps.credential_free_inventory.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: credential-free-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: trainer-app/artifacts/credential-free-inventory/
          if-no-files-found: error
          retention-days: 7

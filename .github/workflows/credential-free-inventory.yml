name: Trainer pull request checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: credential-free-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  credential-free-inventory:
    name: credential-free-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      TZ: America/Chicago
    defaults:
      run:
        working-directory: trainer-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trainer-app/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Run credential-free inventory
        run: npm run test:inventory:credential-free -- --base-ref origin/master
